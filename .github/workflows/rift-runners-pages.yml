name: Rift Runners — test and deploy
on:
  push:
    branches: [main, claude/code-tool-approval-issue-ll0ku0]
    paths: ['rift-runners/**', '.github/workflows/rift-runners-pages.yml']
  pull_request:
    paths: ['rift-runners/**', '.github/workflows/rift-runners-pages.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: rift-runners-pages-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test-and-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax and dependency checks
        working-directory: rift-runners
        run: npm run check
      - name: Simulation, gesture, privacy and replay tests
        working-directory: rift-runners
        run: npm test
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install browser test tools
        working-directory: rift-runners
        run: |
          python -m pip install -r tests/requirements.txt
          python -m playwright install --with-deps chromium
      - name: Browser UI, input and consent checks
        working-directory: rift-runners
        run: |
          PORT=4173 node tools/serve.mjs > /tmp/rift-runners-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID"' EXIT
          for attempt in $(seq 1 20); do
            if curl --fail --silent http://127.0.0.1:4173/driftfall/ > /dev/null; then break; fi
            sleep 1
          done
          python tests/browser_smoke.py --out qa-webgl
          python tests/browser_smoke.py --compatibility --out qa-compatibility
      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rift-runners-browser-evidence
          path: |
            rift-runners/qa-webgl
            rift-runners/qa-compatibility
          if-no-files-found: ignore
      - name: Stage the static website
        run: |
          mkdir -p _site
          cp rift-runners/index.html rift-runners/styles.css rift-runners/icon.svg rift-runners/LICENSE _site/
          cp -R rift-runners/src _site/src
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
  deploy:
    if: github.event_name != 'pull_request' && (github.ref_name == github.event.repository.default_branch || github.ref_name == 'main' || github.event_name == 'workflow_dispatch')
    needs: test-and-package
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v4
